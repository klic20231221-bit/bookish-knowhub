<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threads 文章索引</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFAF4;--card:#fff;--ink:#2E4238;--mut:#6B7B70;--line:#E2E8DA;--sage:#7FA38A;--deep:#4A7658;--hl:#F8EBB8;--chip:#EAF1E4;--peach:#F6C6AE;--pk:#FCE3D6;--warn:#B8573A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B231F;--card:#232D28;--ink:#E6EEE3;--mut:#9AAB9F;--line:#34423A;--sage:#8DB89A;--deep:#A9D3B4;--hl:#3B3921;--chip:#2B3A31;--peach:#7A5443;--pk:#4B352C;--warn:#EE9C80}}
:root[data-theme="dark"]{--bg:#1B231F;--card:#232D28;--ink:#E6EEE3;--mut:#9AAB9F;--line:#34423A;--sage:#8DB89A;--deep:#A9D3B4;--hl:#3B3921;--chip:#2B3A31;--peach:#7A5443;--pk:#4B352C;--warn:#EE9C80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.serif{font-family:"Noto Serif TC","Songti TC",serif}
header{max-width:1080px;margin:0 auto;padding:44px 20px 26px;display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font:700 34px/1.25 "Noto Serif TC","Songti TC",serif;letter-spacing:.04em;display:flex;align-items:center;gap:12px}
h1 svg{flex:none}
.sub{margin:6px 0 0;color:var(--mut);font-size:15px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,button{font:inherit;color:inherit}
.search{width:220px;max-width:100%;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.btn{padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer}
.btn:hover{border-color:var(--sage)}
.btn.on{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.pri{background:var(--deep);border-color:var(--deep);color:#fff}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px;display:grid;grid-template-columns:230px 1fr;gap:44px;align-items:start}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);border-right:1px solid var(--line);padding-right:20px}
nav h2{margin:0 0 10px;font:500 15px "Noto Serif TC",serif;color:var(--mut)}
.cat{display:flex;align-items:center;gap:4px;border-radius:10px}
.cat>button.n{flex:1;display:flex;justify-content:space-between;gap:8px;text-align:left;padding:8px 12px;border:0;border-left:3px solid transparent;border-radius:10px;background:none;cursor:pointer}
.cat>button.n:hover{background:var(--chip)}
.cat.act>button.n{background:var(--hl);border-left-color:var(--sage);font-weight:500}
.cat .ct{color:var(--mut);font-size:14px}
.mini{border:0;background:none;color:var(--mut);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:13px}
.mini:hover{color:var(--deep)}.mini:disabled{opacity:.3;cursor:default}.mini:disabled:hover{color:var(--mut)}.mini.del.ask{color:#fff;background:var(--warn)}
.addcat{margin-top:12px;width:100%}
main h2.m{margin:34px 0 4px;font:700 19px "Noto Serif TC",serif;color:var(--deep)}
main h2.m:first-child{margin-top:0}
.cur{margin:0 0 6px;font:700 26px "Noto Serif TC",serif}
.post{display:grid;grid-template-columns:64px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px dashed var(--line)}
.when{display:flex;flex-direction:column;align-items:center;line-height:1.2;padding-top:3px}
.when b{font:700 20px "Noto Serif TC",serif;color:var(--deep)}
.when span{font-size:12px;color:var(--mut)}
.post h3{margin:0;font:500 18px/1.5 "Noto Serif TC",serif;overflow-wrap:anywhere}
.post h3 a{color:inherit;text-decoration:none;background:linear-gradient(var(--peach),var(--peach)) 0 100%/0 2px no-repeat;transition:background-size .25s}
.post h3 a:hover{background-size:100% 2px}
.nolink{color:var(--mut)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--mut)}
.chip{padding:0 10px;border-radius:999px;background:var(--chip);color:var(--deep)}
.ops{display:flex;gap:2px;align-items:start}
.empty{padding:50px 0;text-align:center;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:24px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(30,40,34,.45)}
dialog h3{margin:0 0 14px;font:700 20px "Noto Serif TC",serif}
label{display:block;margin-bottom:12px;font-size:14px;color:var(--mut)}
label input,label select{display:block;width:100%;margin-top:4px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}

.brand{display:flex;align-items:center;gap:18px}
.logo{flex:none;width:88px;height:88px;border-radius:50%;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--sage),0 8px 18px rgba(70,100,80,.15)}
.mbtn{border:0;background:none;padding:0;cursor:pointer;line-height:0}
.mascot{height:85px;width:auto;transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite}
.mbtn:active .mascot{animation:hop .4s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes hop{50%{transform:translateY(-16px) scale(1.06)}}
.cur::after{content:"";display:block;width:80px;height:8px;margin-top:6px;background:radial-gradient(circle at 4px 4px,var(--peach) 3px,transparent 3.5px) 0 0/16px 8px repeat-x}
main h2.m::before{content:"✿ ";color:var(--sage)}
.cat .ct{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 9px;min-width:28px;text-align:center;font-size:13px;line-height:1.6}
.post{border-radius:18px;padding:16px 12px;transition:background .2s,box-shadow .2s}
.post:hover{background:var(--card);box-shadow:0 4px 14px rgba(70,100,80,.1)}
.when{width:56px;height:56px;border-radius:50%;background:var(--chip);justify-content:center;padding:0;transition:transform .25s}
.post:nth-of-type(3n+2) .when{background:var(--hl)}
.post:nth-of-type(3n) .when{background:var(--pk)}
.post:hover .when{transform:rotate(-8deg) scale(1.08)}
.empty img{display:block;margin:0 auto 10px;height:90px;width:auto}
footer{text-align:center;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 36px);color:var(--mut);font-size:14px}
footer p{margin:6px 0 0}
@media(max-width:760px){
 h1{font-size:27px}.logo{width:64px;height:64px}.when{width:46px;height:46px}.when b{font-size:16px}
 .wrap{grid-template-columns:1fr;gap:20px}
 nav{position:static;border:0;padding:0}
 #cats{display:flex;flex-wrap:wrap;gap:6px}
 .cat>button.n{border:1px solid var(--line);border-left-width:1px;padding:4px 12px}
 .cat.act>button.n{border-color:var(--sage)}
 .post{grid-template-columns:48px 1fr;gap:12px}.ops{grid-column:2}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<dialog id="dp"><h3 id="dpt"></h3>
 <label>標題<input id="ft"></label>
 <label>分類<select id="fc"></select></label>
 <label>發布日期<input id="fd" type="date"></label>
 <label>貼文連結<input id="fu" placeholder="https://www.threads.com/…"></label>
 <div class="row"><button class="btn" id="dpx">取消</button><button class="btn pri" id="dps">儲存</button></div>
</dialog>
<dialog id="dc"><h3 id="dct"></h3>
 <label>分類名稱<input id="fn"></label>
 <div class="row"><button class="btn" id="dcx">取消</button><button class="btn pri" id="dcs">儲存</button></div>
</dialog>
<div id="toast" role="status"></div>
<script>
let S={"cats":[],"posts":[]},cur='*',editing=false,confirmKey=null,onPost=null,onCat=null;
const $=s=>document.querySelector(s);
const M=$('.mascot');const hi=['一起來讀書吧！','翻開書，就是新的一天','慢慢來，比較快','今天也要加油喔','你今天讀書了嗎？'];
$('#hi').onclick=()=>toast(hi[Math.floor(Math.random()*hi.length)]);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
async function load(){
 try{
  const res=await fetch('articles.json?t='+Date.now());
  if(res.ok){
   const data=await res.json();
   if(data&&Array.isArray(data.posts)){
    S=data;
    if(!Array.isArray(S.cats))S.cats=[];
    S.posts.forEach((p,idx)=>{if(!p.id)p.id='p_'+(idx+1)});
   }
  }
 }catch(e){console.error(e)}
}
function save(){
 toast('已暫存預覽（永久更新請至 Pages CMS 後台儲存）');
}
const src=u=>!u?'':/threads/.test(u)?'Threads':/facebook/.test(u)?'Facebook':/instagram/.test(u)?'Instagram':'連結';
function render(){
 const q=$('#q').value.trim().toLowerCase();
 $('#sub').textContent='依主題整理，共 '+S.posts.length+' 篇貼文';
 const cnt={};S.posts.forEach(p=>cnt[p.c]=(cnt[p.c]||0)+1);
 const cats=[['*','全部文章',S.posts.length],...S.cats.map(c=>[c,c,cnt[c]||0])];
 if(cur!=='*'&&!S.cats.includes(cur))cur='*';
 const box=$('#cats');box.textContent='';
 cats.forEach(([k,n,c])=>{
  const d=document.createElement('div');d.className='cat'+(k===cur?' act':'');
  const b=document.createElement('button');b.className='n';b.innerHTML='<span></span><span class="ct"></span>';
  b.firstChild.textContent=n;b.lastChild.textContent=c;b.onclick=()=>{cur=k;render()};d.append(b);
  if(editing&&k!=='*'){
   const i=S.cats.indexOf(k);const mv=(dx,ch)=>{const b=document.createElement('button');b.className='mini';b.textContent=ch;b.setAttribute('aria-label',(dx<0?'上移 ':'下移 ')+n);b.disabled=i+dx<0||i+dx>=S.cats.length;b.onclick=()=>{[S.cats[i],S.cats[i+dx]]=[S.cats[i+dx],S.cats[i]];save();render()};return b};
   d.append(mv(-1,'▲'),mv(1,'▼'));
   const e=document.createElement('button');e.className='mini';e.textContent='改名';e.setAttribute('aria-label','重新命名 '+n);e.onclick=()=>askCat(k);
   const x=document.createElement('button');x.className='mini del'+(confirmKey==='c'+k?' ask':'');x.textContent=confirmKey==='c'+k?'確定刪除？':'刪除';
   x.onclick=()=>{if(confirmKey==='c'+k){S.cats=S.cats.filter(z=>z!==k);S.posts.forEach(p=>{if(p.c===k)p.c='未分類'});if(S.posts.some(p=>p.c==='未分類')&&!S.cats.includes('未分類'))S.cats.push('未分類');confirmKey=null;save();render()}else{confirmKey='c'+k;render()}};
   d.append(e,x)}
  box.append(d)});
 $('#addcat').hidden=!editing;
 let ps=S.posts.filter(p=>(cur==='*'||p.c===cur)&&(!q||p.t.toLowerCase().includes(q))).sort((a,b)=>(b.d||'').localeCompare(a.d||''));
 const L=$('#list');L.textContent='';
 const h=document.createElement('h2');h.className='cur';h.textContent=cur==='*'?'全部文章':cur;L.append(h);
 if(editing){const a=document.createElement('button');a.className='btn pri';a.textContent='＋ 新增文章';a.style.margin='6px 0 8px';a.onclick=()=>askPost();L.append(a)}
 if(!ps.length){const e=document.createElement('div');e.className='empty';const im=document.createElement('img');im.src=M.src;im.alt='';const p=document.createElement('p');p.textContent=q?'找不到符合的文章，換個關鍵字試試。':'這個分類還沒有文章。';e.append(im,p);L.append(e);return}
 let mo='';
 ps.forEach(p=>{
  const dStr=p.d||'2026-01-01';
  const m=dStr.slice(0,4)+' 年 '+(+dStr.slice(5,7))+' 月';
  if(m!==mo){mo=m;const t=document.createElement('h2');t.className='m';t.textContent=m;L.append(t)}
  const a=document.createElement('article');a.className='post';
  a.innerHTML='<time class="when"><b></b><span></span></time><div><h3></h3><div class="meta"><span class="chip"></span><span class="s"></span></div></div><div class="ops"></div>';
  a.querySelector('b').textContent=(+dStr.slice(5,7))+'/'+(+dStr.slice(8,10));a.querySelector('.when span').textContent=dStr.slice(0,4);
  const h3=a.querySelector('h3');
  if(p.u){const l=document.createElement('a');l.href=p.u;l.target='_blank';l.rel='noopener';l.textContent=p.t;h3.append(l)}else{h3.textContent=p.t;h3.classList.add('nolink')}
  a.querySelector('.chip').textContent=p.c;a.querySelector('.s').textContent=p.u?'在 '+src(p.u)+' 閱讀':'尚未加入連結';
  if(editing){
   const e=document.createElement('button');e.className='mini';e.textContent='編輯';e.onclick=()=>askPost(p);
   const x=document.createElement('button');x.className='mini del'+(confirmKey===p.id?' ask':'');x.textContent=confirmKey===p.id?'確定刪除？':'刪除';
   x.onclick=()=>{if(confirmKey===p.id){S.posts=S.posts.filter(z=>z!==p);confirmKey=null;save();render()}else{confirmKey=p.id;render()}};
   a.querySelector('.ops').append(e,x)}
  L.append(a)});
}
function askPost(p){
 onPost=p||null;$('#dpt').textContent=p?'編輯文章':'新增文章';
 $('#fc').innerHTML='';[...S.cats,...(S.cats.includes('未分類')?[]:['未分類'])].forEach(c=>{const o=document.createElement('option');o.textContent=c;$('#fc').append(o)});
 $('#ft').value=p?p.t:'';$('#fc').value=p?p.c:(cur!=='*'?cur:S.cats[0]);
 $('#fd').value=p?p.d:new Date().toISOString().slice(0,10);$('#fu').value=p?p.u:'';$('#dp').showModal();
}
$('#dpx').onclick=()=>$('#dp').close();
$('#dps').onclick=()=>{
 const t=$('#ft').value.trim(),d=$('#fd').value;if(!t||!d){toast('請填寫標題與日期');return}
 const v={t,c:$('#fc').value,d,u:$('#fu').value.trim()};
 if(v.c==='未分類'&&!S.cats.includes('未分類'))S.cats.push('未分類');
 if(onPost)Object.assign(onPost,v);else S.posts.push({id:'n'+Date.now(),...v});
 $('#dp').close();save();render();
};
function askCat(k){onCat=k||null;$('#dct').textContent=k?'重新命名分類':'新增分類';$('#fn').value=k||'';$('#dc').showModal()}
$('#addcat').onclick=()=>askCat();
$('#dcx').onclick=()=>$('#dc').close();
$('#dcs').onclick=()=>{
 const n=$('#fn').value.trim();if(!n)return;
 if(S.cats.includes(n)&&n!==onCat){toast('已經有這個分類了');return}
 if(onCat){S.cats=S.cats.map(c=>c===onCat?n:c);S.posts.forEach(p=>{if(p.c===onCat)p.c=n});if(cur===onCat)cur=n}else S.cats.push(n);
 $('#dc').close();save();render();
};
$('#edit').onclick=()=>{editing=!editing;confirmKey=null;$('#edit').classList.toggle('on',editing);$('#edit').textContent=editing?'完成編輯':'編輯模式';render()};
$('#q').oninput=render;
let lc=0,lt;$('.logo').onclick=()=>{clearTimeout(lt);lt=setTimeout(()=>lc=0,1500);if(++lc>=5){lc=0;$('#edit').hidden=false;toast('已開啟編輯功能')}};
load().then(render);
</script>
</body>
</html>
