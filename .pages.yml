
content:
  - name: articles
    label: 文章與分類管理
    type: file
    path: articles.json
    fields:
      - name: cats
        label: 文章分類順序
        type: string
        list: true
      - name: posts
        label: 所有貼文列表
        type: object
        list: true
        fields:
          - name: t
            label: 文章標題
            type: string
            required: true
          - name: c
            label: 分類
            type: select
            required: true
            options:
              values:
                - 國小
                - 國中先修
                - 國中
                - 國中會考
                - 高中先修
                - 高中升大
                - 讀書方法
                - 寫作
                - 知識帖
                - 活動宣傳
                - 未分類
          - name: d
            label: 發布日期
            type: date
            required: true
          - name: u
            label: 貼文連結
            type: string